<!DOCTYPE html>
<html lang="ro" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracking AWB - Dragon Star Curier</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="bg-primary pt-3">
        <div class="container py-3">
            <div class="d-flex flex-column flex-lg-row justify-content-between">
                <h1 class="fw-bold ls-wider text-white mb-0">VERIFICARE AWB</h1>
            </div>
        </div>
    </div>

    <div class="container my-4">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <h2 class="h1 mb-4 ls-wider text-center">TRACKING AWB</h2>
                <form method="get" action="/tracking">
                    <label for="awb" class="visually-hidden">Introduceți codul AWB</label>
                    <input id="awb" name="awb" type="text" class="form-control mb-4 py-3 border-2 border-white fs-4 fw-lighter"
                           autocomplete="off" placeholder="Introduceți codul AWB" required>
                    <div class="text-center">
                        <button class="btn btn-danger py-3 px-5 rounded-5 fs-5" type="submit">CAUTĂ</button>
                    </div>
                </form>

                <div class="mt-5 p-4 border border-secondary rounded">
                    <h5 class="mb-3">AWB-uri de test:</h5>
                    <ul class="list-unstyled">
                        <li class="mb-2">
                            <a href="/tracking?awb=290591591" class="text-decoration-none">290591591</a> - Livrat
                        </li>
                        <li>
                            <a href="/tracking?awb=123456789" class="text-decoration-none">123456789</a> - În livrare
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
